<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基础综合题 · 成语辨析</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f5f7; color: #1f2329; line-height: 1.7;
    min-height: 100vh; padding: 24px 16px 60px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  /* 顶部进度条 */
  .progress { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; flex-wrap: wrap; }
  .pill {
    width: 40px; height: 40px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 15px; cursor: pointer;
    background: #fff; border: 2px solid #dcdfe6; color: #909399;
    transition: transform .08s;
  }
  .pill:active { transform: scale(.92); }
  .pill.current { border-color: #409eff; color: #409eff; }
  .pill.correct { background: #e7f7ec; border-color: #52c41a; color: #389e0d; }
  .pill.wrong   { background: #fdecec; border-color: #f5222d; color: #cf1322; }
  .pill.done    { background: #e6f4ff; border-color: #1677ff; color: #1677ff; }
  textarea { width:100%; min-height:90px; padding:12px; margin-top:8px; border:2px solid #ebeef5; border-radius:10px; font-family:inherit; font-size:15px; resize:vertical; outline:none; }
  textarea:focus { border-color:#409eff; }
  textarea:disabled { background:#fafafa; color:#555; }
  .progress-hint { text-align: center; color: #909399; font-size: 13px; margin-bottom: 20px; }

  /* 题卡 */
  .card { background: #fff; border-radius: 12px; padding: 28px 28px 24px; box-shadow: 0 2px 12px rgba(0,0,0,.05); }
  .q-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .q-no { font-size: 18px; font-weight: 700; }
  .q-type { font-size: 12px; color: #909399; background: #f0f2f5; padding: 2px 10px; border-radius: 10px; }

  .passage {
    font-size: 16px; background: #fafbfc; border: 1px solid #eef0f3;
    border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; text-indent: 2em;
  }
  .passage b {
    font-weight: 700; color: #1f2329;
    border-bottom: 2px solid #c0392b; padding-bottom: 1px;
  }
  .stem { font-size: 15.5px; margin-bottom: 14px; font-weight: 600; }

  .opt {
    display: block; width: 100%; text-align: left;
    background: #fafafa; border: 2px solid #ebeef5; border-radius: 10px;
    padding: 12px 16px; margin-bottom: 10px; font-size: 16px;
    cursor: pointer; transition: border-color .15s, background .15s;
    font-family: inherit; color: #1f2329;
  }
  .opt:hover:not(:disabled) { border-color: #c0c4cc; }
  .opt:disabled { cursor: default; }
  .opt .label { font-weight: 700; margin-right: 10px; }
  .opt .tag { float: right; font-size: 13px; font-weight: 700; }
  .opt.is-answer  { border-color: #52c41a; background: #f0fbf2; }
  .opt.is-answer .tag { color: #389e0d; }
  .opt.is-chosen-wrong { border-color: #f5222d; background: #fef0f0; }
  .opt.is-chosen-wrong .tag { color: #cf1322; }

  /* 解析 */
  .analysis { margin-top: 6px; border-top: 1px dashed #e0e0e0; padding-top: 16px; display: none; }
  .analysis.show { display: block; }
  .analysis h4 { font-size: 14px; color: #909399; margin-bottom: 10px; font-weight: 600; }
  .ana-item { font-size: 14.5px; margin-bottom: 9px; }
  .ana-item .ci { font-weight: 700; }
  .ana-item.wrong-one .ci { color: #c0392b; }
  .ana-item .mtype { font-size: 12px; color: #fff; background: #c0392b; padding: 1px 7px; border-radius: 8px; margin-left: 6px; }
  .ana-item .mean { color: #555; }

  .footer { margin-top: 22px; text-align: right; }
  .btn {
    background: #409eff; color: #fff; border: none; border-radius: 8px;
    padding: 10px 26px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .btn:active { opacity: .85; }
  .btn.ghost { background: #fff; color: #409eff; border: 2px solid #409eff; }

  /* 总结页 */
  .summary { text-align: center; }
  .score-big { font-size: 52px; font-weight: 800; color: #409eff; margin: 10px 0 2px; }
  .score-sub { color: #909399; margin-bottom: 24px; }
  .wrong-list { text-align: left; max-width: 420px; margin: 0 auto 24px; }
  .wrong-row { display: flex; justify-content: space-between; background: #fef0f0; border-radius: 8px; padding: 10px 16px; margin-bottom: 8px; }
  .wrong-row .wt { color: #cf1322; font-weight: 600; }
  .all-right { color: #389e0d; font-weight: 600; margin-bottom: 24px; }
  .err-box { background: #fff; border-radius: 12px; padding: 40px 28px; text-align: center; color: #cf1322; }
</style>
</head>
<body>
<div class="wrap">
  <div class="progress" id="progress"></div>
  <div class="progress-hint" id="hint">点击上方序号可回看已做的题</div>
  <div id="view"></div>
</div>

<!-- 各题型的题库：每个文件夹下加载两个 js：
       示例.js  ——committed 进 git 的 demo 数据（永远存在）
       题库.js  ——用户跑 generate.py 后产生的真题库（gitignored，可能 404 不影响）
     两者都往 window.TIMU 里追加。-->
<script src="idioms/示例.js"></script>          <script src="idioms/题库.js"></script>
<script src="pinyin/示例.js"></script>          <script src="pinyin/题库.js"></script>
<script src="error_sentence/示例.js"></script>  <script src="error_sentence/题库.js"></script>
<script src="error_passage/示例.js"></script>   <script src="error_passage/题库.js"></script>
<script src="punctuation/示例.js"></script>     <script src="punctuation/题库.js"></script>
<script src="diction/示例.js"></script>         <script src="diction/题库.js"></script>
<script src="couplet/示例.js"></script>         <script src="couplet/题库.js"></script>
<script src="composition/示例.js"></script>     <script src="composition/题库.js"></script>
<script>
"use strict";
const TIMU_DB = window.TIMU || [];   // 汇总所有题型的题库

/* ===== 配置：题型配额（扩展口）=====
   以后建好字音字形/病句/标点库，把对应题型的题加进 语段题库.js，
   再在这里加一行配额即可，界面代码不用动。
   例：const QUOTA = { '字音字形':1, '成语':1, '词语':1, '病句':1, '标点':1, '仿写':1, '对联':1 }; */
const QUOTA = { '字音字形': 1, '词语': 1, '成语': 1, '病句语段': 1, '标点': 1, '仿写补写': 1, '对联': 1 };
const POINT_PER_Q = 2;
const LETTERS = ['A', 'B', 'C', 'D'];

/* ===== 工具 ===== */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(arr,n){ return shuffle(arr).slice(0,n); }
// 把语段里出现的成语加点（下加粗红线）
function markPassage(passage, idioms){
  let html = passage;
  idioms.forEach(w=>{ html = html.replace(w, '<b>'+w+'</b>'); });
  return html;
}

/* ===== 组卷：按配额从 语段题库 抽题 ===== */
// 复制一道题并把 4 个选项重新随机排序（避免错项位置偏置）
function shuffleOptions(q){
  // 开放题(仿写补写)没有 options；fixedOrder=true 的题(如病句语段，①②③④ 顺序对应位置)不能洗牌
  if(!q.options || q.fixedOrder) return Object.assign({}, q);
  const answerOpt = q.options[q.answerIndex];
  const opts = shuffle(q.options);
  return Object.assign({}, q, {
    options: opts,
    answerIndex: opts.indexOf(answerOpt)
  });
}
function buildQuiz(){
  const quiz = [];
  for(const type in QUOTA){
    const pool = TIMU_DB.filter(q => q.type === type);
    quiz.push(...sample(pool, Math.min(QUOTA[type], pool.length)).map(shuffleOptions));
  }
  return quiz;
}

/* ===== 状态 ===== */
let QUIZ, chosen, cur;
function initState(){
  QUIZ = buildQuiz();
  chosen = QUIZ.map(()=>null);
  cur = 0;
}

/* ===== 渲染 ===== */
function render(){
  // 题库未加载或为空
  if(typeof TIMU_DB === 'undefined' || !TIMU_DB.length){
    document.getElementById('view').innerHTML =
      '<div class="err-box">题库未加载。<br>请确认各题型文件夹下的 示例.js / 题库.js 都在，<br>并先运行过各自的 generate.py。</div>';
    return;
  }
  renderProgress();
  const view = document.getElementById('view');
  if(cur === 'summary'){ view.innerHTML = renderSummary(); bindSummary(); return; }
  view.innerHTML = renderQuestion(cur);
  bindQuestion(cur);
}

function renderProgress(){
  const box = document.getElementById('progress');
  box.innerHTML = '';
  QUIZ.forEach((q,i)=>{
    const pill = document.createElement('div');
    pill.className = 'pill';
    pill.textContent = i+1;
    if(chosen[i]!==null){
      if(q.type === '仿写补写') pill.classList.add('done');
      else pill.classList.add(chosen[i]===q.answerIndex ? 'correct' : 'wrong');
    }
    if(cur===i) pill.classList.add('current');
    pill.onclick = ()=>{ cur=i; render(); };
    box.appendChild(pill);
  });
}

// 在词语里把加点字标出来
function markChar(word, ch){ return word.replace(ch, '<b>'+ch+'</b>'); }

function renderQuestion(idx){
  const q = QUIZ[idx];
  const answered = chosen[idx]!==null;

  let html = '<div class="card">';
  html += '<div class="q-head"><span class="q-no">第 '+(idx+1)+' 题</span>'
        + '<span class="q-type">'+q.type+'</span></div>';

  // 题目主体：按题型分派
  html += (q.type === '字音字形') ? bodyZyzx(q, idx, answered)
        : (q.type === '病句')     ? bodyBingju(q, idx, answered)
        : (q.type === '病句语段') ? bodyBingjuPassage(q, idx, answered)
        : (q.type === '标点')     ? bodyBiaodian(q, idx, answered)
        : (q.type === '词语')     ? bodyCiyu(q, idx, answered)
        : (q.type === '对联')     ? bodyDuilian(q, idx, answered)
        : (q.type === '仿写补写') ? bodyFangxie(q, idx, answered)
        :                           bodyChengyu(q, idx, answered);

  // 底部按钮
  html += '<div class="footer">';
  if(answered){
    html += (idx < QUIZ.length-1)
      ? '<button class="btn" id="next">下一题 →</button>'
      : '<button class="btn" id="toSummary">查看总结</button>';
  } else {
    html += '<span style="color:#c0c4cc;font-size:13px;">选择一个选项后立即出答案</span>';
  }
  html += '</div></div>';
  return html;
}

// —— 成语题：语段 + 4 个成语选项 ——
function bodyChengyu(q, idx, answered){
  const idioms = q.options.map(o=>o.idiom);
  let html = '<div class="passage">'+markPassage(q.passage, idioms)+'</div>';
  html += '<div class="stem">文段中加点成语使用<b>不恰当</b>的一项是（　　）</div>';
  q.options.forEach((o,i)=>{
    let cls = 'opt', tag = '';
    if(answered){
      if(i===q.answerIndex){ cls+=' is-answer'; tag='<span class="tag">✓ 此项用错</span>'; }
      else if(i===chosen[idx]){ cls+=' is-chosen-wrong'; tag='<span class="tag">✗ 你的选择</span>'; }
    }
    html += '<button class="'+cls+'" data-i="'+i+'"'+(answered?' disabled':'')+'>'
          + '<span class="label">'+LETTERS[i]+'</span>'+o.idiom+tag+'</button>';
  });
  html += '<div class="analysis'+(answered?' show':'')+'"><h4>成语释义</h4>';
  q.options.forEach((o,i)=>{
    const isWrong = (i===q.answerIndex);
    html += '<div class="ana-item'+(isWrong?' wrong-one':'')+'">'
          + '<span class="ci">'+LETTERS[i]+'. '+o.idiom+'</span>'
          + (isWrong && o.trapType ? '<span class="mtype">'+o.trapType+'</span>' : '')
          + ' <span class="mean">'+o.meaning+'</span></div>';
  });
  html += '</div>';
  return html;
}

// —— 词语：语段挖空 + 4 个词语组合 ——
function bodyCiyu(q, idx, answered){
  let passageHtml = q.passage.replace(/[①②③④]/g,
    m => '<b style="color:#c0392b;background:#fff3cd;padding:0 4px;">'+m+'</b>');
  passageHtml = passageHtml.replace(/_{3,}/g,
    '<span style="background:#fff3cd;padding:0 6px;border-bottom:2px solid #c0392b;">______</span>');
  let html = '<div class="passage">'+passageHtml+'</div>';
  html += '<div class="stem">'+q.stem+'（　　）</div>';
  q.options.forEach((o,i)=>{
    let cls = 'opt', tag = '';
    if(answered){
      if(i===q.answerIndex){ cls+=' is-answer'; tag='<span class="tag">✓ 正确</span>'; }
      else if(i===chosen[idx]){ cls+=' is-chosen-wrong'; tag='<span class="tag">✗ 你的选择</span>'; }
    }
    html += '<button class="'+cls+'" data-i="'+i+'"'+(answered?' disabled':'')+'>'
          + '<span class="label">'+LETTERS[i]+'</span>'+o.text+tag+'</button>';
  });
  if(answered && q.analysis){
    html += '<div class="analysis show"><h4>解析</h4>'
          + '<div class="ana-item"><span class="mean">'+q.analysis+'</span></div></div>';
  }
  return html;
}

// —— 对联：给上联(或下联)选另一句 ——
function bodyDuilian(q, idx, answered){
  let html = '';
  if(q.context) html += '<div style="color:#909399;font-size:14px;margin-bottom:8px;">'+q.context+'</div>';
  html += '<div style="background:#fffbe6;border:1px solid #ffe58f;border-radius:10px;padding:14px 18px;margin-bottom:14px;font-size:17px;font-weight:600;text-align:center;">'+q.given+'</div>';
  html += '<div class="stem">'+q.stem+'（　　）</div>';
  q.options.forEach((o,i)=>{
    let cls = 'opt', tag = '';
    if(answered){
      if(i===q.answerIndex){ cls+=' is-answer'; tag='<span class="tag">✓ 正确</span>'; }
      else if(i===chosen[idx]){ cls+=' is-chosen-wrong'; tag='<span class="tag">✗ 你的选择</span>'; }
    }
    html += '<button class="'+cls+'" data-i="'+i+'"'+(answered?' disabled':'')+'>'
          + '<span class="label">'+LETTERS[i]+'</span>'+o.text+tag+'</button>';
  });
  if(answered && q.analysis){
    html += '<div class="analysis show"><h4>解析</h4>'
          + '<div class="ana-item"><span class="mean">'+q.analysis+'</span></div></div>';
  }
  return html;
}

// —— 病句·语段版：一段话里 4 处标号句，选有语病的一项；选项 ABCD 固定对应①②③④ ——
function bodyBingjuPassage(q, idx, answered){
  // 把 ①②③④ 标号在 passage 里高亮
  const passageHtml = q.passage.replace(/[①②③④]/g,
    m => '<b style="color:#1677ff;font-size:17px;">'+m+'</b>');
  const NUM = ['①','②','③','④'];
  let html = '<div class="passage">'+passageHtml+'</div>';
  html += '<div class="stem">'+q.stem+'（　　）</div>';
  q.options.forEach((o,i)=>{
    let cls = 'opt', tag = '';
    if(answered){
      if(i===q.answerIndex){ cls+=' is-answer'; tag='<span class="tag">✓ 此句有语病</span>'; }
      else if(i===chosen[idx]){ cls+=' is-chosen-wrong'; tag='<span class="tag">✗ 你的选择</span>'; }
    }
    html += '<button class="'+cls+'" data-i="'+i+'"'+(answered?' disabled':'')+'>'
          + '<span class="label">'+LETTERS[i]+'</span>'
          + '<b style="color:#1677ff;margin-right:6px;">'+NUM[i]+'</b>'
          + o.sentence + tag + '</button>';
  });
  if(answered){
    html += '<div class="analysis show"><h4>解析</h4>';
    if(q.analysis) html += '<div class="ana-item"><span class="ci">说明</span> <span class="mean">'+q.analysis+'</span></div>';
    if(q.fix) html += '<div class="ana-item"><span class="ci">修改后</span> <span class="mean">'+q.fix+'</span></div>';
    html += '</div>';
  }
  return html;
}

// —— 仿写/补写：开放题，学生写文本，提交后展示参考答案对比 ——
function bodyFangxie(q, idx, answered){
  const written = answered ? chosen[idx] : '';
  const ctx = (q.context||'').replace(/_{3,}/g,
    '<span style="background:#fff3cd;padding:0 6px;border-bottom:2px solid #c0392b;">______</span>');
  let html = '<div class="stem"><span class="q-type" style="background:#fef0f0;color:#c0392b;margin-right:6px;">'+q.kind+'</span>'+q.task+'</div>';
  html += '<div class="passage" style="margin-top:8px;">'+ctx+'</div>';
  html += '<textarea id="fxInput" placeholder="在此输入你的答案" '
        + (answered?'disabled':'')+'>'+written+'</textarea>';
  if(answered){
    html += '<div class="analysis show"><h4>参考答案（不止一种写法，仅供对比）</h4>';
    q.references.forEach((r,i)=>{
      html += '<div class="ana-item"><span class="ci">参考'+(i+1)+'</span> <span class="mean">'+r+'</span></div>';
    });
    html += '</div>';
  } else {
    html += '<div style="margin-top:10px;text-align:right;"><button class="btn" id="fxSubmit">提交答案</button></div>';
  }
  return html;
}

// —— 标点题：语段含【甲】【乙】挖空，4 个标点组合选项 ——
function bodyBiaodian(q, idx, answered){
  // 把【甲】【乙】【丙】高亮
  const passageHtml = q.passage.replace(/【[甲乙丙丁]】/g,
    m => '<b style="color:#c0392b;">'+m+'</b>');
  let html = '<div class="passage">'+passageHtml+'</div>';
  html += '<div class="stem">'+q.stem+'（　　）</div>';
  q.options.forEach((o,i)=>{
    let cls = 'opt', tag = '';
    if(answered){
      if(i===q.answerIndex){ cls+=' is-answer'; tag='<span class="tag">✓ 正确</span>'; }
      else if(i===chosen[idx]){ cls+=' is-chosen-wrong'; tag='<span class="tag">✗ 你的选择</span>'; }
    }
    html += '<button class="'+cls+'" data-i="'+i+'"'+(answered?' disabled':'')+'>'
          + '<span class="label">'+LETTERS[i]+'</span>'+o.text+tag+'</button>';
  });
  if(answered && q.analysis){
    html += '<div class="analysis show"><h4>解析</h4>'
          + '<div class="ana-item"><span class="mean">'+q.analysis+'</span></div></div>';
  }
  return html;
}

// —— 病句题：无语段，4 句话选有语病的一项 ——
function bodyBingju(q, idx, answered){
  let html = '<div class="stem" style="margin-top:4px;">'+q.stem+'（　　）</div>';
  q.options.forEach((o,i)=>{
    let cls = 'opt', tag = '';
    if(answered){
      if(i===q.answerIndex){ cls+=' is-answer'; tag='<span class="tag">✓ 此项有语病</span>'; }
      else if(i===chosen[idx]){ cls+=' is-chosen-wrong'; tag='<span class="tag">✗ 你的选择</span>'; }
    }
    html += '<button class="'+cls+'" data-i="'+i+'"'+(answered?' disabled':'')+'>'
          + '<span class="label">'+LETTERS[i]+'</span>'+o.sentence+tag+'</button>';
  });
  const ans = q.options[q.answerIndex];
  html += '<div class="analysis'+(answered?' show':'')+'"><h4>解析</h4>';
  if(ans.btype) html += '<div class="ana-item"><span class="ci">病句类型</span>'
                     + ' <span class="mtype">'+ans.btype+(ans.subtype?'·'+ans.subtype:'')+'</span></div>';
  if(ans.fix)   html += '<div class="ana-item"><span class="ci">修改后</span>'
                     + ' <span class="mean">'+ans.fix+'</span></div>';
  if(ans.diagnosis) html += '<div class="ana-item"><span class="ci">说明</span>'
                         + ' <span class="mean">'+ans.diagnosis+'</span></div>';
  html += '</div>';
  return html;
}

// —— 字音字形题：无语段，4 个「例词(读音) 词语」选项 ——
function bodyZyzx(q, idx, answered){
  let html = '<div class="stem" style="margin-top:4px;">'+q.stem+'（　　）</div>';
  q.options.forEach((o,i)=>{
    let cls = 'opt', tag = '';
    if(answered){
      if(i===q.answerIndex){ cls+=' is-answer'; tag='<span class="tag">✓ 全对</span>'; }
      else if(i===chosen[idx]){ cls+=' is-chosen-wrong'; tag='<span class="tag">✗ 你的选择</span>'; }
    }
    html += '<button class="'+cls+'" data-i="'+i+'"'+(answered?' disabled':'')+'>'
          + '<span class="label">'+LETTERS[i]+'</span>'
          + markChar(o.word_yin, o.char)+'（'+o.reading+'）'
          + '　　'+o.word_xing + tag + '</button>';
  });
  html += '<div class="analysis'+(answered?' show':'')+'"><h4>解析</h4>';
  html += '<div class="ana-item"><span class="ci">字音</span> <span class="mean">'+q.explain.yin+'</span></div>';
  html += '<div class="ana-item"><span class="ci">字形</span> <span class="mean">'+q.explain.xing+'</span></div>';
  html += '</div>';
  return html;
}

function bindQuestion(idx){
  const q = QUIZ[idx];
  if(chosen[idx]===null){
    if(q.type === '仿写补写'){
      const sub = document.getElementById('fxSubmit');
      const ta = document.getElementById('fxInput');
      if(sub) sub.onclick = ()=>{
        const v = (ta && ta.value || '').trim();
        if(v.length < 4){ alert('答案太短，请认真写。'); return; }
        chosen[idx] = v;
        render();
      };
    } else {
      document.querySelectorAll('.opt').forEach(btn=>{
        btn.onclick = ()=>{ chosen[idx] = parseInt(btn.dataset.i,10); render(); };
      });
    }
  } else {
    const next = document.getElementById('next');
    if(next) next.onclick = ()=>{ cur=idx+1; render(); };
    const ts = document.getElementById('toSummary');
    if(ts) ts.onclick = ()=>{ cur='summary'; render(); };
  }
}

function renderSummary(){
  const total = QUIZ.length;
  const doneCount = chosen.filter(c=>c!==null).length;
  // 仿写补写：答了即算满分（不评对错，老师课上点评）
  const correctCount = QUIZ.filter((q,i)=>{
    if(chosen[i]===null) return false;
    if(q.type==='仿写补写') return true;
    return chosen[i]===q.answerIndex;
  }).length;
  const score = correctCount * POINT_PER_Q;
  const full = total * POINT_PER_Q;

  let html = '<div class="card summary">';
  html += '<div class="score-big">'+score+'<span style="font-size:24px;color:#c0c4cc;"> / '+full+'</span></div>';
  html += '<div class="score-sub">共 '+total+' 题，每题 '+POINT_PER_Q+' 分　答对 '+correctCount+' 题';
  if(doneCount<total) html += '（还有 '+(total-doneCount)+' 题未做）';
  html += '</div>';

  const wrongs = [];
  QUIZ.forEach((q,i)=>{
    if(chosen[i]===null) return;
    if(q.type==='仿写补写') return;   // 开放题不算错
    if(chosen[i]!==q.answerIndex) wrongs.push({no:i+1,q:q});
  });

  if(wrongs.length===0 && doneCount===total){
    html += '<div class="all-right">全部答对，没有错题</div>';
  } else if(wrongs.length>0){
    html += '<div class="wrong-list">';
    wrongs.forEach(w=>{
      const o = w.q.options[w.q.answerIndex];
      const detail = w.q.type === '字音字形'
          ? (o.word_yin+'（'+o.reading+'）'+o.word_xing)
        : (w.q.type === '病句' || w.q.type === '病句语段')
          ? (o.sentence||'').slice(0,30)
        : (w.q.type === '标点' || w.q.type === '词语' || w.q.type === '对联')
          ? (o.text||'').slice(0,30)
        : o.idiom;
      const right = w.q.type === '字音字形' ? ''
                  : w.q.type === '病句'     ? (o.btype||'')
                  : w.q.type === '病句语段' ? ''
                  : (w.q.type === '标点' || w.q.type === '词语' || w.q.type === '对联') ? ''
                  :                           (o.trapType||'');
      html += '<div class="wrong-row"><span>第 '+w.no+' 题　'+w.q.type+'　'+detail+'</span>'
            + '<span class="wt">'+right+'</span></div>';
    });
    html += '</div>';
  }
  html += '<button class="btn ghost" id="restart">再做一组</button></div>';
  return html;
}

function bindSummary(){
  document.getElementById('restart').onclick = ()=>{ initState(); render(); };
}

if(typeof TIMU_DB !== 'undefined' && TIMU_DB.length) initState();
render();
</script>
