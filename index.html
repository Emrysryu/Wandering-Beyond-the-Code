<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Wandering Beyond the Code · 语文教学与写作工坊</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="site-revision" content="2026-05-28-structure-refresh">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #3f6f8f;
    }
    .markdown-section {
      max-width: 920px;
    }
    .app-name-link img {
      max-width: 56px;
    }
    .sidebar-nav strong {
      color: #2f5068;
    }
    .sidebar-nav em {
      color: #6f7d86;
      font-style: normal;
      font-size: 0.92em;
    }
    .markdown-section table {
      display: table;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Wandering Beyond the Code',
      repo: 'https://github.com/Emrysryu/Wandering-Beyond-the-Code',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      mergeNavbar: true,
      search: {
        placeholder: '搜索讲义、真题、文章',
        noData: '没有结果',
        depth: 3,
      },
      plugins: [
        function(hook) {
          hook.doneEach(function() {
            var counter = document.getElementById('busuanzi-counter');
            if (!counter) {
              counter = document.createElement('div');
              counter.id = 'busuanzi-counter';
              counter.style.cssText = 'text-align:right;font-size:0.85em;color:#999;margin-top:2em;padding-top:1em;border-top:1px solid #eee;';
              document.querySelector('article') && document.querySelector('article').appendChild(counter);
            }
            counter.innerHTML = '本文阅读量 <span id="busuanzi_value_page_pv">...</span> 次';
          });
        }
      ],
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
